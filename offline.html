<!DOCTYPE html>
<html lang="id">
<head>

<title>Tidak ada koneksi — SiGaji</title>
<style>

.box{max-width:22rem;margin:0 auto;padding:3.5rem 1.25rem 2rem;text-align:center;}
h1{font-size:1.25rem;margin:0 0 .6rem;}
p{font-size:.9rem;line-height:1.45;color:#9fb0c8;margin:0 0 1.25rem;}

</style>
</head>
<body>
<div class="box">
  <h1>Tidak ada koneksi</h1>

<script>
document.getElementById('retry').addEventListener('click', function () { location.href = '/'; });
</script>
